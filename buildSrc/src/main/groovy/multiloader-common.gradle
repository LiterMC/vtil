	}

	exclusiveContent {
		forRepository {
			maven {
				name = 'Create Mod Forge 0.5'
				url = 'https://maven.tterrag.com'
			}
		}
		forRepository {
			maven {
				name = 'Create Mod 6.0'
				url = 'https://maven.createmod.net'
			}
		}
		forRepository {
			maven {
				name = 'Create Mod Fabric Snapshots'
				url = 'https://mvn.devos.one/snapshots'
			}
		}
		forRepository {
			maven {
