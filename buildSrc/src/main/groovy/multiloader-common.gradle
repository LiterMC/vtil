				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup('maven.modrinth')
		}
	}

	exclusiveContent {
		forRepository {
			maven {
				name = 'Valkyrien Skies'
				url = 'https://maven.valkyrienskies.org'
			}
